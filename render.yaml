# Free hosting only. Account data lives in a separate Neon Free database.
services:
  - type: web
    name: velocity-arena
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    branch: codex/velocity-arena
    autoDeployTrigger: "off"
    buildCommand: npm ci --omit=dev --ignore-scripts && npm run db:migrate
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: REQUIRE_DATABASE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://velocity-arena.netlify.app
